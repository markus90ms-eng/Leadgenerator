<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kollektion – ELYSION</title>
<meta name="description" content="Alle verfügbaren Luxusuhren nach Marke, Preis und Neuheit filtern.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
<section class="page-head"><div class="wrap"><div class="crumbs"><a href="index.html">Start</a> / Kollektion</div><p class="eyebrow">Kollektion</p><h1>Aktuell verfügbar</h1><p>Jede Uhr einzeln geprüft. Preise inklusive Versand und Versicherung.</p></div></section>
<div class="wrap">
  <div class="filters"><div class="chips" id="chips"></div>
    <div class="frow"><select id="price" aria-label="Preis"><option value="all">Alle Preise</option><option value="0-30000">bis 30.000 €</option><option value="30000-100000">30.000 – 100.000 €</option><option value="100000-9999999">ab 100.000 €</option></select>
    <select id="sort" aria-label="Sortierung"><option value="new">Neueste zuerst</option><option value="asc">Preis aufsteigend</option><option value="desc">Preis absteigend</option></select>
    <input type="search" id="q" placeholder="Suche …" aria-label="Suche"></div></div>
  <p class="count" id="count"></p>
  <div class="grid" id="grid" style="padding-bottom:110px"></div>
</div>
</main>
<script src="common.js"></script>
<script>
const st={brand:"alle",price:"all",sort:"new",q:""};
const keys=["alle","neu",...BRANDS.map(b=>b.slug)];
const label=k=>k==="alle"?"Alle":k==="neu"?"Neuzugänge":BRANDS.find(b=>b.slug===k).name;
function render(){
  $("#chips").innerHTML=keys.map(k=>`<button class="chip ${k===st.brand?"on":""}" data-k="${k}">${label(k)}</button>`).join("");
  let l=PRODUCTS.filter(p=>st.brand==="alle"||(st.brand==="neu"?p.isNew:slug(p.brand)===st.brand));
  if(st.price!=="all"){const[a,b]=st.price.split("-").map(Number);l=l.filter(p=>p.price>=a&&p.price<b);}
  if(st.q){const q=st.q.toLowerCase();l=l.filter(p=>`${p.brand} ${p.name} ${p.ref} ${p.material} ${p.dial}`.toLowerCase().includes(q));}
  l.sort(st.sort==="asc"?(a,b)=>a.price-b.price:st.sort==="desc"?(a,b)=>b.price-a.price:(a,b)=>b.id-a.id);
  $("#count").textContent=l.length+(l.length===1?" Uhr":" Uhren");
  $("#grid").innerHTML=l.length?l.map(card).join(""):`<p class="empty">Keine Treffer. <a class="link" href="kontakt.html">Wunschuhr anfragen</a></p>`;
  renderLists();
}
function fromHash(){const h=location.hash.slice(1);if(keys.includes(h))st.brand=h;render();}
function initPage(){
  $("#chips").onclick=e=>{const b=e.target.closest("[data-k]");if(b){st.brand=b.dataset.k;history.replaceState(null,"","#"+st.brand);render();}};
  $("#price").onchange=e=>{st.price=e.target.value;render();};
  $("#sort").onchange=e=>{st.sort=e.target.value;render();};
  $("#q").oninput=e=>{st.q=e.target.value.trim();render();};
  window.addEventListener("hashchange",fromHash);fromHash();
}
</script>
</body></html>
